model:
  base: "runwayml/stable-diffusion-v1-5"  # pretrained starting point

data:
  resolution: 512                          # SD v1.5 native size
  prompts_file: "data/prompts/test_prompts.txt"  # fixed eval prompts

eval:
  n_prompts: 200                           # consistent across all runs
  seeds: [0, 1, 2, 3, 4]                  # 200 x 5 = 1000 images per run

generation:
  scheduler: "dpm_solver_pp"              # best quality at low steps
  num_inference_steps: 30                 # quality vs speed tradeoff
  guidance_scale: 7.5                     # prompt vs diversity balance
  negative_prompt: ""                     # ablated in A09

training:
  lora_rank: 16                           # adapter capacity (ablated A05)
  lora_alpha: 16                          # scales LoRA output strength
  lora_target_modules: ["to_q", "to_k", "to_v", "to_out.0"]  # attention only
  learning_rate: 0.0001                   # standard LoRA lr
  max_train_steps: 2000                   # ablated in A06
  train_batch_size: 1                     # fits T4 16GB
  gradient_accumulation_steps: 4          # effective batch size = 4
  mixed_precision: "fp16"                 # halves GPU memory
  gradient_checkpointing: true            # trades speed for memory
  use_8bit_adam: true                     # saves optimizer memory
  checkpointing_steps: 500               # resume if Colab disconnects
  seed: 42                               # reproducible runs

output:
  dir: "outputs"
  log_with: "csv"                         # switch to "wandb" for live charts
